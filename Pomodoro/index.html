<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Focus Flow</h1>
            <p class="subtitle">Work smarter, not harder</p>
        </header>

        <div class="theme-selector">
            <button class="theme-btn active" data-theme="forest">🌲 Forest</button>
            <button class="theme-btn" data-theme="ocean">🌊 Ocean</button>
            <button class="theme-btn" data-theme="cafe">☕ Café</button>
            <button class="theme-btn" data-theme="rain">🌧️ Rain</button>
        </div>

        <div class="timer-display">
            <div class="mode-indicator">
                <span class="mode-text">Focus Time</span>
            </div>
            <div class="time" id="timeDisplay">25:00</div>
            <div class="progress-ring">
                <svg width="300" height="300">
                    <circle cx="150" cy="150" r="140" class="progress-ring-circle-bg"></circle>
                    <circle cx="150" cy="150" r="140" class="progress-ring-circle" id="progressCircle"></circle>
                </svg>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="startBtn">
                <span class="btn-icon">▶</span>
                <span class="btn-text">Start</span>
            </button>
            <button class="control-btn" id="pauseBtn" disabled>
                <span class="btn-icon">⏸</span>
                <span class="btn-text">Pause</span>
            </button>
            <button class="control-btn" id="resetBtn">
                <span class="btn-icon">↻</span>
                <span class="btn-text">Reset</span>
            </button>
        </div>

        <div class="session-config">
            <div class="config-item">
                <label>Focus (min)</label>
                <input type="number" id="focusTime" value="25" min="1" max="60">
            </div>
            <div class="config-item">
                <label>Short Break (min)</label>
                <input type="number" id="shortBreak" value="5" min="1" max="30">
            </div>
            <div class="config-item">
                <label>Long Break (min)</label>
                <input type="number" id="longBreak" value="15" min="1" max="60">
            </div>
        </div>

        <div class="sound-controls">
            <label class="sound-toggle">
                <input type="checkbox" id="soundToggle" checked>
                <span>🔊 Ambient Sounds</span>
            </label>
            <input type="range" id="volumeControl" min="0" max="100" value="50" class="volume-slider">
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="sessionsCompleted">0</div>
                <div class="stat-label">Sessions</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalMinutes">0</div>
                <div class="stat-label">Minutes</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
